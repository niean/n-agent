<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <title>N-Agent</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <script>(function(){try{var v=localStorage.getItem('nagent.sidebar.expanded');var ex=v==='0'?false:true;document.body.classList.toggle('sidebar-expanded',ex);var t=document.getElementById('sidebar-toggle');if(t)t.setAttribute('aria-expanded',String(ex));}catch(_){document.body.classList.add('sidebar-expanded');}})();</script>
  <aside class="sidebar" id="app-sidebar" aria-label="主导航">
    <button class="sidebar__toggle" id="sidebar-toggle" type="button" aria-label="展开导航" aria-expanded="true">
      <span class="sidebar__brand"><span class="sidebar__brand-icon">NA</span><span>N-Agent</span></span>
      <span class="sidebar__toggle-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </button>
    <nav class="sidebar__nav" aria-label="N-Agent 导航">
      <a class="sidebar__item" href="/chat" data-tab="chat">
        <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4V6Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="sidebar__item-label">对话</span>
      </a>
      <a class="sidebar__item" href="/scheduled-tasks" data-tab="scheduled-tasks">
        <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 3v3M17 3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="sidebar__item-label">定时任务</span>
      </a>
      <hr class="sidebar__divider" aria-hidden="true">
      <a class="sidebar__item" href="/sessions" data-tab="sessions">
        <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="sidebar__item-label">会话</span>
      </a>
      <a class="sidebar__item" href="/tasks" data-tab="tasks">
        <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6h7v5H4V6ZM13 6h7v5h-7V6ZM4 13h7v5H4v-5ZM13 13h7v5h-7v-5Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="sidebar__item-label">任务</span>
      </a>
      <a class="sidebar__item" href="/memory" data-tab="memory">
        <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 0 0 12 18a3 3 0 0 0 0-6 3 3 0 0 0 0-6Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 0 1 12 18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="sidebar__item-label">记忆</span>
      </a>
      <div class="sidebar__group" data-tab-group="tools">
        <button class="sidebar__item sidebar__item--parent" type="button" data-tab="tools" aria-expanded="false">
          <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a4 4 0 1 1-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 1 5.4-5.4l-2 2 2 2 2-2-2-2 2-2-2-2-2 2Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="sidebar__item-label">工具</span>
          <span class="sidebar__item-chevron" aria-hidden="true">▸</span>
        </button>
        <div class="sidebar__submenu" data-submenu-of="tools">
          <a class="sidebar__item sidebar__item--child" href="/tools/knowledge" data-tab="tools-knowledge"><span class="sidebar__item-icon" aria-hidden="true"></span><span class="sidebar__item-label">知识</span></a>
          <a class="sidebar__item sidebar__item--child" href="/tools/mcp" data-tab="tools-mcp"><span class="sidebar__item-icon" aria-hidden="true"></span><span class="sidebar__item-label">MCP</span></a>
          <a class="sidebar__item sidebar__item--child" href="/tools/skill" data-tab="tools-skill"><span class="sidebar__item-icon" aria-hidden="true"></span><span class="sidebar__item-label">Skill</span></a>
          <a class="sidebar__item sidebar__item--child" href="/tools/plugin" data-tab="tools-plugin"><span class="sidebar__item-icon" aria-hidden="true"></span><span class="sidebar__item-label">Plugin</span></a>
          <a class="sidebar__item sidebar__item--child" href="/tools/builtin" data-tab="tools-builtin"><span class="sidebar__item-icon" aria-hidden="true"></span><span class="sidebar__item-label">Builtin</span></a>
        </div>
      </div>
      <div class="sidebar__group" data-tab-group="executors">
        <button class="sidebar__item sidebar__item--parent" type="button" data-tab="executors" aria-expanded="false">
          <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7h14M5 12h14M5 17h14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="sidebar__item-label">执行器</span>
          <span class="sidebar__item-chevron" aria-hidden="true">▸</span>
        </button>
        <div class="sidebar__submenu" data-submenu-of="executors">
          <a class="sidebar__item sidebar__item--child" href="/sandbox" data-tab="sandbox"><span class="sidebar__item-icon" aria-hidden="true"></span><span class="sidebar__item-label">沙盒</span></a>
          <a class="sidebar__item sidebar__item--child" href="/executors/host" data-tab="executors-host"><span class="sidebar__item-icon" aria-hidden="true"></span><span class="sidebar__item-label">本机</span></a>
          <a class="sidebar__item sidebar__item--child" href="/browser" data-tab="browser"><span class="sidebar__item-icon" aria-hidden="true"></span><span class="sidebar__item-label">浏览器</span></a>
        </div>
      </div>
      <a class="sidebar__item" href="/artifacts" data-tab="artifacts" hidden>
        <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 7l8-4 8 4-8 4-8-4ZM4 7v10l8 4 8-4V7M12 11v10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="sidebar__item-label">制品</span>
      </a>
      <a class="sidebar__item" href="/models" data-tab="models">
        <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke-width="2"/><path d="M19 12c0 3.9-3.1 7-7 7s-7-3.1-7-7 3.1-7 7-7M19 5l-7 7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="sidebar__item-label">模型</span>
      </a>
      <a class="sidebar__item" href="/platforms" data-tab="platforms">
        <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M5 8h14M7 16h10M5 8l2 8M19 8l-2 8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="sidebar__item-label">平台</span>
      </a>
      <hr class="sidebar__divider" aria-hidden="true">
      <div class="sidebar__group" data-tab-group="observations">
        <button class="sidebar__item sidebar__item--parent" type="button" data-tab="observations" aria-expanded="false">
          <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 3v18h18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 14l3-3 3 3 5-7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="sidebar__item-label">观测</span>
          <span class="sidebar__item-chevron" aria-hidden="true">▸</span>
        </button>
        <div class="sidebar__submenu" data-submenu-of="observations">
          <a class="sidebar__item sidebar__item--child" href="/observations/sessions" data-tab="observations-sessions"><span class="sidebar__item-icon" aria-hidden="true"></span><span class="sidebar__item-label">会话</span></a>
          <a class="sidebar__item sidebar__item--child" href="/observations/modules" data-tab="observations-modules"><span class="sidebar__item-icon" aria-hidden="true"></span><span class="sidebar__item-label">组件</span></a>
        </div>
      </div>
      <a class="sidebar__item" href="/security" data-tab="security">
        <span class="sidebar__item-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3l8 3v6c0 5-3.4 7.7-8 9-4.6-1.3-8-4-8-9V6l8-3Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="sidebar__item-label">安全</span>
      </a>
    </nav>
  </aside>

  <header class="topbar">
    <div id="topbar-title-wrap"><span id="topbar-title"></span></div>
    <div id="topnav-mount" hidden></div>
    <div class="topbar__reserved" aria-hidden="true"></div>
  </header>

  <main class="main-content">
    <div class="tab-content" id="tab-summary">
      <div class="stats-bar" id="summary-stats"></div>
      <section class="status-panel">
        <div class="panel-header"><span>功能入口</span></div>
        <div class="panel-body"><div class="summary-entries" id="summary-entries"></div></div>
      </section>
    </div>

    <div class="tab-content" id="tab-chat">
      <div class="chat-shell chat-shell--side-collapsed" id="chat-shell">
        <section class="status-panel chat-session-panel" id="chat-session-panel">
          <div class="panel-header chat-session-panel__header"><span>会话</span><div class="chat-session-panel__actions"><button class="chat-session-toggle-btn" type="button" id="chat-session-toggle-btn" aria-label="隐藏会话列表" aria-controls="chat-session-panel" aria-expanded="true" title="隐藏会话列表">
              <svg class="chat-session-toggle-btn__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1" class="session-toggle__panel" stroke="currentColor" stroke-width="2"/><path d="M10 4v16" stroke="currentColor" stroke-width="2"/></svg>
            </button><button class="chat-session-search-btn" type="button" id="chat-session-search-btn" aria-label="搜索会话" title="搜索会话"><svg class="chat-session-search-btn__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><button class="chat-session-filter-btn" type="button" id="chat-session-filter-btn" aria-label="筛选会话类型" title="筛选会话类型"><svg class="chat-session-filter-btn__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h16l-6 7v5l-4 2v-7L4 5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div>
          <div class="panel-body"><div id="chat-session-list" class="session-list"></div></div>
        </section>
        <button class="chat-session-expand-btn" type="button" id="chat-session-expand-btn" aria-label="展开会话列表" aria-controls="chat-session-panel" aria-expanded="false" title="展开会话列表" hidden>
          <svg class="chat-session-expand-btn__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1" stroke="currentColor" stroke-width="2"/><path d="M10 4v16" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <section class="chat-stack" aria-label="对话区">
          <header class="panel-header">
            <strong id="chat-header">N-Agent Chat</strong>
            <button class="chat-side-toggle-btn" type="button" id="chat-side-toggle-btn" aria-label="展开/收起更多信息" aria-expanded="false" title="展开/收起更多信息">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <rect x="15" y="4" width="6" height="16" rx="1" class="side-toggle__panel"/>
              </svg>
            </button>
          </header>
          <div class="chat-stack__messages" id="chat-messages" aria-live="polite">
            <div class="message-stack" id="chat-message-stack"></div>
          </div>
          <div class="chat-stack__composer">
            <div class="chat-composer" id="chat-composer">
              <div id="chat-image-previews" class="chat-image-previews"></div>
              <textarea id="chat-input" placeholder="给 N-Agent 发送消息..." rows="1"></textarea>
              <div class="chat-composer__bar">
                <button class="chat-composer__icon-btn" id="chat-image-button" type="button" aria-label="上传图片" title="上传图片">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <input type="file" id="chat-image-input" accept="image/*" multiple hidden>
                <button class="chat-composer__send" id="chat-send" type="button" aria-label="发送" title="发送">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
              </div>
            </div>
          </div>
        </section>
        <section class="status-panel chat-side-panel" id="chat-side-panel">
          <div class="panel-header"></div>
          <div class="panel-body" id="chat-side-body">
            <div class="chat-tabs" role="tablist" aria-label="侧栏信息">
              <button class="chat-tab chat-tab--active" id="chat-tab-tool-button" role="tab" type="button" data-tab="tool" aria-selected="true" aria-controls="chat-tab-tool" tabindex="0">工具调用</button>
              <button class="chat-tab" id="chat-tab-artifact-button" role="tab" type="button" data-tab="artifact" aria-selected="false" aria-controls="chat-tab-artifact" tabindex="-1">制品信息</button>
            </div>
            <div class="chat-tab-panels">
              <div class="chat-tab-content" id="chat-tab-tool" role="tabpanel" aria-labelledby="chat-tab-tool-button">
                <div class="debug-section"><h4>Session Summary</h4><pre id="chat-summary">暂未选择会话</pre></div>
                <div class="debug-section"><h4>Task State</h4><div id="chat-task-state">暂未选择会话</div></div>
                <div class="debug-section"><h4>Tool Calls</h4><div id="chat-tool-calls">暂未选择会话</div></div>
              </div>
              <div class="chat-tab-content" id="chat-tab-artifact" role="tabpanel" aria-labelledby="chat-tab-artifact-button" hidden>
                <div id="chat-artifact-list" class="artifacts-list__items" aria-live="polite">暂未选择会话</div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div class="tab-content" id="tab-tasks">
      <div id="tasks-board-view">
        <section class="status-panel">
          <div class="panel-header">
            <span>任务看板</span>
            <span class="panel-actions">
              <button class="btn" id="task-new" type="button">新增</button>
            </span>
          </div>
          <div class="panel-body" id="tasks-board"></div>
        </section>
      </div>
      <div id="tasks-detail-view" hidden></div>
    </div>

    <div class="tab-content" id="tab-tasks-observations"></div>
    <div class="tab-content" id="tab-tasks-security"></div>

    <div class="tab-content" id="tab-artifacts" hidden></div>

    <div class="tab-content" id="tab-scheduled-tasks">
      <div id="scheduled-tasks-list-view">
        <section class="status-panel">
          <div class="panel-header"><span>整体概览</span></div>
          <div class="panel-body" id="scheduled-tasks-stats"></div>
        </section>
        <section class="status-panel">
          <div class="panel-header">
            <span>任务列表</span>
            <span class="panel-actions">
              <button class="btn" id="scheduled-task-new" type="button">新增</button>
            </span>
          </div>
          <div class="panel-body" id="scheduled-tasks-list"></div>
        </section>
      </div>
      <div id="scheduled-tasks-detail-view" hidden></div>
    </div>

    <div class="tab-content" id="tab-platforms">
      <section class="status-panel">
        <div class="panel-header"><span>平台</span></div>
        <div class="panel-body" id="platforms-list"></div>
      </section>
    </div>

    <div class="tab-content" id="tab-sessions">
      <section class="status-panel">
        <div class="panel-header"><span>会话列表</span><button class="chat-session-filter-btn" type="button" id="sessions-filter-btn" aria-label="筛选会话类型" title="筛选会话类型"><svg class="chat-session-filter-btn__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h16l-6 7v5l-4 2v-7L4 5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
        <div class="panel-body" id="sessions-list"></div>
      </section>
    </div>

    <div class="tab-content" id="tab-memory">
      <div id="external-memory-files"></div>
      <div id="external-memory-providers-list"></div>
    </div>

    <div class="tab-content" id="tab-tools-knowledge"></div>

    <div class="tab-content" id="tab-tools-mcp">
      <section class="status-panel">
        <div class="panel-header">
          <span>MCP 站点</span>
          <span class="panel-actions">
            <button class="btn" id="mcp-site-new" type="button">新增</button>
          </span>
        </div>
        <div class="panel-body" id="mcp-sites-list"></div>
      </section>
      <section class="status-panel">
        <div class="panel-header"><span>MCP 工具</span></div>
        <div class="panel-body" id="mcp-tools-list"></div>
      </section>
    </div>

    <div class="tab-content" id="tab-tools-skill"></div>

    <div class="tab-content" id="tab-tools-plugin"></div>

    <div class="tab-content" id="tab-tools-builtin">
      <section class="status-panel">
        <div class="panel-header"><span>工具列表</span></div>
        <div class="panel-body" id="tools-list"></div>
      </section>
    </div>

    <div class="tab-content" id="tab-sandbox"></div>

    <div class="tab-content" id="tab-executors-host"></div>

    <div class="tab-content" id="tab-models">
      <section class="status-panel">
        <div class="panel-header">
          <span>Provider</span>
          <span class="panel-actions">
            <button class="btn" id="providers-new" type="button">新增</button>
          </span>
        </div>
        <div class="panel-body">
          <div class="providers-list" id="providers-list"></div>
          <div class="modal-backdrop" id="providers-modal" hidden>
            <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="providers-form-title">
              <form class="providers-form" id="providers-form">
                <div class="modal-header">
                  <h4 id="providers-form-title">新增 Provider</h4>
                  <button class="modal-close" id="providers-form-close" type="button" aria-label="关闭">×</button>
                </div>
                <input type="hidden" id="provider-id">
                <label>名称 <input type="text" id="provider-name" required></label>
                <label>类型
                  <select id="provider-type">
                    <option value="openai-compatible">openai-compatible</option>
                    <option value="anthropic">anthropic</option>
                  </select>
                </label>
                <label>Base URL <input type="text" id="provider-base-url" required placeholder="http://..."></label>
                <label>Model <input type="text" id="provider-model" required></label>
                <label>API Key <input type="password" id="provider-api-key" placeholder="留空保持不变；输入空格清空"></label>
                <label class="providers-form__checkbox"><input type="checkbox" id="provider-supports-vision"> 支持 Vision（图片输入）</label>
                <div class="providers-form__hint muted" id="providers-form-hint"></div>
                <div class="providers-form__actions">
                  <button class="btn btn--primary" type="submit" id="providers-form-save">保存</button>
                  <button class="btn" type="button" id="providers-form-cancel">取消</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
      <section class="status-panel">
        <div class="panel-header"><span>模型列表（当前Provider）</span></div>
        <div class="panel-body" id="models-list"></div>
      </section>
    </div>

    <div class="tab-content" id="tab-observations-modules"></div>

    <div class="tab-content" id="tab-observations-sessions"></div>
    <div class="tab-content" id="tab-security"></div>
    <div class="tab-content" id="tab-browser"></div>
  </main>

  <script src="/static/management-ui.js"></script>
  <script src="/static/management-api.js"></script>
  <script src="/static/management-navigation.js"></script>
  <script src="/static/summary.js"></script>
  <script src="/static/chat.js"></script>
  <script src="/static/sessions.js"></script>
  <script src="/static/knowledge.js"></script>
  <script src="/static/plugin.js"></script>
  <script src="/static/tools.js"></script>
  <script src="/static/models.js"></script>
  <script src="/static/health.js"></script>
  <script src="/static/scheduled-tasks.js"></script>
<script src="/static/tasks.js"></script>
  <script src="/static/platforms.js"></script>
  <script src="/static/skills.js"></script>
  <script src="/static/external-memory.js"></script>
  <script src="/static/external-memory-providers.js"></script>
  <script src="/static/sandbox.js"></script>
  <script src="/static/host.js"></script>
  <script src="/static/observations.js"></script>
  <script src="/static/security.js"></script>
  <script src="/static/topnav.js"></script>
  <script src="/static/tasks-observations.js"></script>
  <script src="/static/tasks-security.js"></script>
  <script src="/static/browser.js"></script>
  <script src="/static/artifacts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
