<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N-Agent Chat</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; background: #f7f7f8; color: #1f2937; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
button, textarea { font: inherit; }
button { cursor: pointer; }
.chat-shell { min-height: 100vh; display: flex; position: relative; overflow: hidden; }
.chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 100vh; }
.topbar { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; background: rgba(255,255,255,.86); border-bottom: 1px solid #e5e7eb; backdrop-filter: blur(12px); }
.topbar-title { min-width: 0; text-align: center; }
.topbar-title strong { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-title span { display: block; color: #6b7280; font-size: 12px; }
.icon-btn, .secondary-btn, .send-btn { border: 1px solid #d1d5db; border-radius: 10px; background: #fff; color: #111827; }
.icon-btn { width: 38px; height: 38px; }
.secondary-btn { padding: 9px 12px; }
.send-btn { padding: 0 18px; color: #fff; background: #111827; border-color: #111827; }
.send-btn:disabled { cursor: not-allowed; opacity: .5; }
.messages { flex: 1; overflow-y: auto; padding: 24px; }
.message-stack { max-width: 860px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.empty-state { margin: auto; max-width: 560px; text-align: center; color: #6b7280; }
.empty-state h1 { margin-bottom: 12px; color: #111827; font-size: 32px; }
.msg { max-width: 78%; padding: 12px 14px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
.msg.user { align-self: flex-end; color: #fff; background: #111827; border-bottom-right-radius: 6px; }
.msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 6px; }
.msg.tool { align-self: flex-start; max-width: 90%; background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.msg.system, .msg.error { align-self: center; max-width: 90%; background: #f3f4f6; border: 1px solid #e5e7eb; color: #6b7280; font-size: 12px; }
.composer { padding: 16px 24px 24px; background: linear-gradient(180deg, rgba(247,247,248,0), #f7f7f8 24%); }
.composer-inner { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; padding: 10px; background: #fff; border: 1px solid #d1d5db; border-radius: 18px; box-shadow: 0 12px 30px rgba(15,23,42,.08); }
.composer textarea { flex: 1; min-height: 44px; max-height: 160px; resize: vertical; border: 0; outline: 0; line-height: 1.5; }
.composer-hint { max-width: 860px; margin: 8px auto 0; color: #9ca3af; font-size: 12px; text-align: center; }
.session-drawer, .debug-drawer { position: fixed; top: 0; bottom: 0; z-index: 20; width: min(360px, 92vw); display: flex; flex-direction: column; background: #fff; box-shadow: 0 20px 50px rgba(15,23,42,.18); transition: transform .2s ease; }
.session-drawer { left: 0; transform: translateX(-105%); border-right: 1px solid #e5e7eb; }
.debug-drawer { right: 0; transform: translateX(105%); border-left: 1px solid #e5e7eb; }
.session-drawer.open, .debug-drawer.open { transform: translateX(0); }
.drawer-header { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 14px; border-bottom: 1px solid #e5e7eb; }
.drawer-header h2, .drawer-header h3 { font-size: 15px; }
.session-actions { padding: 12px; border-bottom: 1px solid #f3f4f6; }
.session-list { flex: 1; overflow-y: auto; padding: 8px; }
.session { width: 100%; padding: 11px 12px; border: 0; border-radius: 10px; background: transparent; text-align: left; color: #374151; }
.session:hover { background: #f3f4f6; }
.session.active { background: #eef2ff; color: #3730a3; }
.debug-content { flex: 1; overflow-y: auto; padding: 14px; }
.debug-section { margin-bottom: 14px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 12px; background: #fafafa; }
.debug-section h4 { margin-bottom: 8px; color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.debug-section pre, .tool-call { white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.status-badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; }
.status-badge.running { background: #e0f2fe; color: #0369a1; }
.status-badge.completed { background: #dcfce7; color: #166534; }
.status-badge.failed { background: #fee2e2; color: #991b1b; }
.backdrop { position: fixed; inset: 0; z-index: 10; display: none; background: rgba(15,23,42,.2); }
.backdrop.open { display: block; }
@media (max-width: 720px) {
  .messages { padding: 16px; }
  .msg { max-width: 92%; }
  .composer { padding: 12px; }
  .topbar-title span { display: none; }
}
</style>
</head>
<body>
<div class="chat-shell">
  <div class="backdrop" id="backdrop" onclick="closeDrawers()"></div>
  <aside class="session-drawer" id="sessionDrawer" aria-label="Sessions">
    <div class="drawer-header">
      <h2>Chats</h2>
      <button class="icon-btn" onclick="closeSessionDrawer()" aria-label="Close sessions">×</button>
    </div>
    <div class="session-actions">
      <button class="secondary-btn" onclick="newSession()">+ New Chat</button>
    </div>
    <div class="session-list" id="sessionList"></div>
  </aside>

  <main class="chat-main">
    <header class="topbar">
      <button class="icon-btn" onclick="openSessionDrawer()" aria-label="Open sessions">☰</button>
      <div class="topbar-title">
        <strong id="header">N-Agent Chat</strong>
        <span>Enter to send, Shift+Enter for newline</span>
      </div>
      <button class="secondary-btn" onclick="openDebugDrawer()">Debug</button>
    </header>
    <section class="messages" id="messages" aria-live="polite">
      <div class="message-stack" id="messageStack"></div>
    </section>
    <section class="composer">
      <div class="composer-inner">
        <textarea id="input" placeholder="Message N-Agent..." onkeydown="handleComposerKeydown(event)"></textarea>
        <button class="send-btn" id="sendButton" onclick="send()">Send</button>
      </div>
      <div class="composer-hint">Dashboard sends through /v1/chat/completions with metadata.session_id.</div>
    </section>
  </main>

  <aside class="debug-drawer" id="debugDrawer" aria-label="Debug drawer">
    <div class="drawer-header">
      <h3>Debug</h3>
      <button class="icon-btn" onclick="closeDebugDrawer()" aria-label="Close debug">×</button>
    </div>
    <div class="debug-content">
      <div class="debug-section">
        <h4>Session Summary</h4>
        <pre id="summary">No session selected.</pre>
      </div>
      <div class="debug-section">
        <h4>Task State</h4>
        <div id="taskState">No session selected.</div>
      </div>
      <div class="debug-section">
        <h4>Tool Calls</h4>
        <div id="toolCalls">No session selected.</div>
      </div>
    </div>
  </aside>
</div>

<script>
let currentSessionId = null;
let isSending = false;

function byId(id) {
  return document.getElementById(id);
}

function appendText(parent, value) {
  parent.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
}

function clearNode(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

function openSessionDrawer() {
  byId('sessionDrawer').classList.add('open');
  byId('backdrop').classList.add('open');
}

function closeSessionDrawer() {
  byId('sessionDrawer').classList.remove('open');
  if (!byId('debugDrawer').classList.contains('open')) byId('backdrop').classList.remove('open');
}

function openDebugDrawer() {
  byId('debugDrawer').classList.add('open');
  byId('backdrop').classList.add('open');
  if (currentSessionId) loadToolCalls();
}

function closeDebugDrawer() {
  byId('debugDrawer').classList.remove('open');
  if (!byId('sessionDrawer').classList.contains('open')) byId('backdrop').classList.remove('open');
}

function closeDrawers() {
  byId('sessionDrawer').classList.remove('open');
  byId('debugDrawer').classList.remove('open');
  byId('backdrop').classList.remove('open');
}

function setSending(next) {
  isSending = next;
  byId('sendButton').disabled = next;
  byId('sendButton').textContent = next ? 'Sending' : 'Send';
  byId('input').disabled = next;
}

function setStatusMessage(text, role = 'system') {
  const stack = byId('messageStack');
  clearNode(stack);
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  appendText(el, text);
  stack.appendChild(el);
}

function showEmptyState() {
  const stack = byId('messageStack');
  clearNode(stack);
  const empty = document.createElement('div');
  empty.className = 'empty-state';
  const title = document.createElement('h1');
  title.textContent = 'How can N-Agent help?';
  const text = document.createElement('p');
  text.textContent = 'Start a new chat or open an existing session. Debug details stay tucked away until you need them.';
  empty.appendChild(title);
  empty.appendChild(text);
  stack.appendChild(empty);
}

function scrollMessagesToBottom() {
  const messages = byId('messages');
  messages.scrollTop = messages.scrollHeight;
}

function createMessageElement(message) {
  const el = document.createElement('div');
  el.className = `msg ${message.role || 'assistant'}`;
  appendText(el, message.content || '');
  return el;
}

function appendMessage(role, content) {
  const stack = byId('messageStack');
  const empty = stack.querySelector('.empty-state');
  if (empty) clearNode(stack);
  const el = createMessageElement({ role, content });
  stack.appendChild(el);
  scrollMessagesToBottom();
  return el;
}

async function loadSessions() {
  const list = byId('sessionList');
  try {
    const res = await fetch('/chat/sessions');
    const sessions = await res.json();
    clearNode(list);
    if (sessions.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'session';
      empty.textContent = 'No chats yet';
      list.appendChild(empty);
      return;
    }
    for (const session of sessions) {
      const item = document.createElement('button');
      item.className = `session${session.id === currentSessionId ? ' active' : ''}`;
      item.type = 'button';
      item.onclick = () => selectSession(session.id);
      item.textContent = session.title || session.id;
      list.appendChild(item);
    }
  } catch (error) {
    clearNode(list);
    const el = document.createElement('div');
    el.className = 'session';
    appendText(el, 'Failed to load sessions: ' + error);
    list.appendChild(el);
  }
}

async function selectSession(id) {
  currentSessionId = id;
  byId('header').textContent = id;
  try {
    const res = await fetch(`/chat/sessions/${encodeURIComponent(id)}`);
    const detail = await res.json();
    const stack = byId('messageStack');
    clearNode(stack);
    const messages = detail.messages || [];
    if (messages.length === 0) showEmptyState();
    for (const message of messages) stack.appendChild(createMessageElement(message));
    updateInfo(detail);
    closeSessionDrawer();
    await loadSessions();
    scrollMessagesToBottom();
  } catch (error) {
    setStatusMessage('Failed to load session: ' + error, 'error');
  }
}

async function ensureSession() {
  if (currentSessionId) return currentSessionId;
  const id = 'session-' + Date.now();
  await fetch(`/chat/sessions?session_id=${encodeURIComponent(id)}`, { method: 'POST' });
  currentSessionId = id;
  byId('header').textContent = id;
  showEmptyState();
  updateInfo({});
  await loadSessions();
  return id;
}

async function newSession() {
  currentSessionId = null;
  await ensureSession();
  closeSessionDrawer();
}

function updateInfo(detail) {
  const summary = byId('summary');
  const taskState = byId('taskState');
  if (!currentSessionId) {
    summary.textContent = 'No session selected.';
    taskState.textContent = 'No session selected.';
    byId('toolCalls').textContent = 'No session selected.';
    return;
  }
  summary.textContent = detail.summary ? detail.summary.summary : 'No summary yet.';
  clearNode(taskState);
  const ts = detail.task_state;
  if (ts) {
    const badge = document.createElement('span');
    badge.className = `status-badge ${ts.status}`;
    badge.textContent = ts.status;
    const meta = document.createElement('span');
    meta.textContent = ` iter=${ts.iteration_count}${ts.last_error ? ' err=' + ts.last_error : ''}`;
    taskState.appendChild(badge);
    taskState.appendChild(meta);
  } else {
    taskState.textContent = 'No task state yet.';
  }
  loadToolCalls();
}

async function loadToolCalls() {
  const target = byId('toolCalls');
  if (!currentSessionId) {
    target.textContent = 'No session selected.';
    return;
  }
  try {
    const res = await fetch(`/chat/sessions/${encodeURIComponent(currentSessionId)}/tool-calls`);
    const calls = await res.json();
    clearNode(target);
    if (calls.length === 0) {
      target.textContent = 'No tool calls yet.';
      return;
    }
    for (const call of calls) {
      const el = document.createElement('div');
      el.className = 'tool-call';
      appendText(el, `${call.tool_name}: ${JSON.stringify(call.arguments)} → ${call.status} (${call.duration_ms}ms)`);
      target.appendChild(el);
    }
  } catch (error) {
    target.textContent = 'Failed to load tool calls: ' + error;
  }
}

function handleComposerKeydown(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    send();
  }
}

async function refreshCurrentSession() {
  if (!currentSessionId) return;
  try {
    const res = await fetch(`/chat/sessions/${encodeURIComponent(currentSessionId)}`);
    const detail = await res.json();
    updateInfo(detail);
    await loadSessions();
  } catch (error) {
    byId('summary').textContent = 'Failed to refresh session: ' + error;
  }
}

async function send() {
  if (isSending) return;
  const input = byId('input');
  const text = input.value.trim();
  if (!text) return;
  await ensureSession();
  input.value = '';
  appendMessage('user', text);
  const streaming = appendMessage('assistant', '');
  setSending(true);
  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'model', messages: [{ role: 'user', content: text }], stream: true, metadata: { session_id: currentSessionId } }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const content = json.choices?.[0]?.delta?.content || '';
          if (content) streaming.textContent += content;
        } catch (error) {}
      }
      scrollMessagesToBottom();
    }
  } catch (error) {
    streaming.className = 'msg error';
    streaming.textContent = '[Error: ' + error + ']';
  } finally {
    setSending(false);
    refreshCurrentSession();
    input.focus();
  }
}

loadSessions();
showEmptyState();
updateInfo({});
</script>
</body>
</html>
