<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N-Agent Chat</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
.sidebar { width: 260px; background: #fff; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; }
.sidebar h2 { padding: 16px; font-size: 16px; border-bottom: 1px solid #e0e0e0; }
.session-list { flex: 1; overflow-y: auto; }
.session { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
.session:hover { background: #f0f4ff; }
.session.active { background: #e0eaff; }
.new-btn { margin: 12px 16px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; background: #fff; }
.new-btn:hover { background: #f0f0f0; }
.main { flex: 1; display: flex; flex-direction: column; }
.header { padding: 16px 20px; background: #fff; border-bottom: 1px solid #e0e0e0; font-weight: 600; }
.messages { flex: 1; overflow-y: auto; padding: 20px; }
.msg { margin-bottom: 16px; padding: 10px 14px; border-radius: 8px; max-width: 80%; }
.msg.user { background: #e8f5e9; align-self: flex-end; margin-left: auto; }
.msg.assistant { background: #fff; border: 1px solid #e0e0e0; }
.msg.tool { background: #fff3e0; font-family: monospace; font-size: 12px; }
.msg.system { background: #f5f5f5; border: 1px solid #e0e0e0; font-size: 12px; }
.input-area { display: flex; padding: 16px; background: #fff; border-top: 1px solid #e0e0e0; }
.input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
.input-area button { margin-left: 8px; padding: 10px 20px; border: none; border-radius: 6px; background: #1976d2; color: #fff; cursor: pointer; }
.input-area button:hover { background: #1565c0; }
.info-panel { width: 300px; background: #fff; border-left: 1px solid #e0e0e0; display: flex; flex-direction: column; }
.info-panel h3 { padding: 16px; font-size: 14px; border-bottom: 1px solid #e0e0e0; }
.info-panel section { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
.info-panel section h4 { font-size: 12px; color: #666; margin-bottom: 6px; }
.tool-call { font-size: 12px; font-family: monospace; background: #fafafa; padding: 8px; border-radius: 4px; margin-bottom: 8px; }
.status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.status-badge.running { background: #e3f2fd; color: #1565c0; }
.status-badge.completed { background: #e8f5e9; color: #2e7d32; }
.status-badge.failed { background: #fce4ec; color: #c62828; }
</style>
</head>
<body>
<div class="sidebar">
  <h2>Sessions</h2>
  <div class="session-list" id="sessionList"></div>
  <button class="new-btn" onclick="newSession()">+ New Session</button>
</div>
<div class="main">
  <div class="header" id="header">Select a session</div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <input id="input" placeholder="Type a message..." onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">Send</button>
  </div>
</div>
<div class="info-panel">
  <h3>Session Info</h3>
  <section>
    <h4>Summary</h4>
    <div id="summary">-</div>
  </section>
  <section>
    <h4>Task State</h4>
    <div id="taskState">-</div>
  </section>
  <section>
    <h4>Tool Calls</h4>
    <div id="toolCalls">-</div>
  </section>
</div>

<script>
let currentSessionId = null;

async function loadSessions() {
  const res = await fetch('/chat/sessions');
  const sessions = await res.json();
  const list = document.getElementById('sessionList');
  list.innerHTML = sessions.map(s =>
    `<div class="session${s.id === currentSessionId ? ' active' : ''}" onclick="selectSession('${s.id}')">${s.title || s.id}</div>`
  ).join('');
}

async function selectSession(id) {
  currentSessionId = id;
  document.getElementById('header').textContent = 'Session: ' + id;
  const res = await fetch(`/chat/sessions/${id}`);
  const detail = await res.json();
  const msgs = document.getElementById('messages');
  msgs.innerHTML = (detail.messages || []).map(m =>
    `<div class="msg ${m.role}">${typeof m.content === 'string' ? m.content : JSON.stringify(m.content)}</div>`
  ).join('');
  updateInfo(detail);
  loadSessions();
}

function updateInfo(detail) {
  document.getElementById('summary').textContent = detail.summary ? detail.summary.summary : '-';
  const ts = detail.task_state;
  document.getElementById('taskState').innerHTML = ts ?
    `<span class="status-badge ${ts.status}">${ts.status}</span> iter=${ts.iteration_count}${ts.last_error ? ' err='+ts.last_error : ''}` : '-';
  loadToolCalls();
}

async function loadToolCalls() {
  if (!currentSessionId) return;
  const res = await fetch(`/chat/sessions/${currentSessionId}/tool-calls`);
  const calls = await res.json();
  document.getElementById('toolCalls').innerHTML = calls.length === 0 ? '-' :
    calls.map(c => `<div class="tool-call">${c.tool_name}: ${JSON.stringify(c.arguments)} → ${c.status} (${c.duration_ms}ms)</div>`).join('');
}

async function ensureSession() {
  if (currentSessionId) return currentSessionId;
  const id = 'session-' + Date.now();
  await fetch(`/chat/sessions?session_id=${encodeURIComponent(id)}`, { method: 'POST' });
  currentSessionId = id;
  document.getElementById('messages').innerHTML = '';
  document.getElementById('header').textContent = 'Session: ' + id;
  loadSessions();
  updateInfo({});
  return id;
}

async function newSession() {
  currentSessionId = null;
  await ensureSession();
}

async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  await ensureSession();
  input.value = '';
  const msgs = document.getElementById('messages');
  msgs.innerHTML += `<div class="msg user">${text}</div>`;
  msgs.innerHTML += `<div class="msg assistant" id="streaming"></div>`;
  msgs.scrollTop = msgs.scrollHeight;
  const streaming = document.getElementById('streaming');
  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'model', messages: [{ role: 'user', content: text }], stream: true, metadata: { session_id: currentSessionId } }),
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      for (const line of chunk.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        const data = line.slice(6).trim();
        if (data === '[DONE]') continue;
        try {
          const json = JSON.parse(data);
          const content = json.choices?.[0]?.delta?.content || '';
          if (content) streaming.textContent += content;
        } catch(e) {}
      }
      msgs.scrollTop = msgs.scrollHeight;
    }
  } catch(e) {
    streaming.textContent = '[Error: ' + e + ']';
  }
  setTimeout(() => { selectSession(currentSessionId); }, 300);
}
</script>
</body>
</html>
