[project]
name = "n-agent"
version = "0.1.0"
description = "N-Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "langgraph>=0.2,<1",
  "openai>=1.0,<3",
  "anthropic>=0.40,<1",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "python-dotenv>=1,<2",
  "httpx>=0.27,<1",
  "lark-oapi>=1.4,<2",
  "mcp>=1,<2",
  "croniter>=2,<7",
  "pyyaml>=6,<7",
]

[project.scripts]
n-agent = "app.interfaces.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
