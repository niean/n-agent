# OTel Collector (contrib) 配置 -- spec 7：三条 pipeline + memory_limiter + batch，
# 有界发送队列与受限重试；debug exporter 仅用于 logs 管线的详细度交付合同。
# Collector 默认仅容器内网接收（compose 不发布宿主端口）。
extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # 12 fields * 1024000 UTF-8 bytes * Span/Event copies + envelope.
        max_recv_msg_size_mib: 32
      http:
        endpoint: 0.0.0.0:4318
        # Same payload with worst-case six-byte JSON escaping, plus envelope.
        max_request_body_size: 167772160

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 160
    spike_limit_mib: 32
  # Log 行体改写：OTLP record 的 body 只有安全事件码，trace_id/span_id 在
  # record 级字段里（Loki 会放入 structured metadata，行内不可 grep）。
  # 改写为 JSON 行后 Grafana Loki 数据源的 derivedFields 才能用
  # "trace_id":"([0-9a-f]+)" 从日志行跳转 Tempo；debug exporter 输出
  # 的事件码与 trace_id 字符串不变（冒烟证据不受影响）。
  transform/loki_json:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          # Preserve the original body string (the sanitized message/event code)
          # before the JSON line rewrite below caches it as "message".
          - 'set(cache["orig_body"], body)'
          # Explicit field projection: application-approved execution facts only.
          - 'set(cache["execution"], {})'
          - 'set(cache["execution"]["error.type"], attributes["error.type"]) where attributes["error.type"] != nil'
          - 'set(cache["execution"]["gen_ai.agent.name"], attributes["gen_ai.agent.name"]) where attributes["gen_ai.agent.name"] != nil'
          - 'set(cache["execution"]["gen_ai.conversation.id"], attributes["gen_ai.conversation.id"]) where attributes["gen_ai.conversation.id"] != nil'
          - 'set(cache["execution"]["gen_ai.operation.name"], attributes["gen_ai.operation.name"]) where attributes["gen_ai.operation.name"] != nil'
          - 'set(cache["execution"]["gen_ai.provider.name"], attributes["gen_ai.provider.name"]) where attributes["gen_ai.provider.name"] != nil'
          - 'set(cache["execution"]["gen_ai.request.model"], attributes["gen_ai.request.model"]) where attributes["gen_ai.request.model"] != nil'
          - 'set(cache["execution"]["gen_ai.request.stream"], attributes["gen_ai.request.stream"]) where attributes["gen_ai.request.stream"] != nil'
          - 'set(cache["execution"]["gen_ai.response.finish_reasons"], attributes["gen_ai.response.finish_reasons"]) where attributes["gen_ai.response.finish_reasons"] != nil'
          - 'set(cache["execution"]["gen_ai.response.model"], attributes["gen_ai.response.model"]) where attributes["gen_ai.response.model"] != nil'
          - 'set(cache["execution"]["gen_ai.tool.call.id"], attributes["gen_ai.tool.call.id"]) where attributes["gen_ai.tool.call.id"] != nil'
          - 'set(cache["execution"]["gen_ai.tool.name"], attributes["gen_ai.tool.name"]) where attributes["gen_ai.tool.name"] != nil'
          - 'set(cache["execution"]["gen_ai.tool.type"], attributes["gen_ai.tool.type"]) where attributes["gen_ai.tool.type"] != nil'
          - 'set(cache["execution"]["gen_ai.usage.input_tokens"], attributes["gen_ai.usage.input_tokens"]) where attributes["gen_ai.usage.input_tokens"] != nil'
          - 'set(cache["execution"]["gen_ai.usage.output_tokens"], attributes["gen_ai.usage.output_tokens"]) where attributes["gen_ai.usage.output_tokens"] != nil'
          - 'set(cache["execution"]["http.request.method"], attributes["http.request.method"]) where attributes["http.request.method"] != nil'
          - 'set(cache["execution"]["http.response.status_code"], attributes["http.response.status_code"]) where attributes["http.response.status_code"] != nil'
