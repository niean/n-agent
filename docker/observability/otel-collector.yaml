          - 'set(cache["evaluation"]["nagent.evaluation.skip_reason"], attributes["nagent.evaluation.skip_reason"]) where attributes["event.name"] == "gen_ai.evaluation.result" and attributes["nagent.evaluation.skip_reason"] != nil'
          - 'set(cache["evaluation"]["nagent.evaluation.status"], attributes["nagent.evaluation.status"]) where attributes["event.name"] == "gen_ai.evaluation.result" and attributes["nagent.evaluation.status"] != nil'
          - 'set(cache["evaluation"]["nagent.evaluation.target.kind"], attributes["nagent.evaluation.target.kind"]) where attributes["event.name"] == "gen_ai.evaluation.result" and attributes["nagent.evaluation.target.kind"] != nil'
          - 'set(cache["evaluation"]["nagent.evaluation.target.service"], attributes["nagent.evaluation.target.service"]) where attributes["event.name"] == "gen_ai.evaluation.result" and attributes["nagent.evaluation.target.service"] != nil'
          - 'set(cache["evaluation"]["nagent.evaluation.target.subject_id"], attributes["nagent.evaluation.target.subject_id"]) where attributes["event.name"] == "gen_ai.evaluation.result" and attributes["nagent.evaluation.target.subject_id"] != nil'
          - 'set(cache["evaluation"]["nagent.evaluation.target.subject_revision"], attributes["nagent.evaluation.target.subject_revision"]) where attributes["event.name"] == "gen_ai.evaluation.result" and attributes["nagent.evaluation.target.subject_revision"] != nil'
          - 'set(cache["evaluation"]["nagent.evaluation.target_completed_at"], attributes["nagent.evaluation.target_completed_at"]) where attributes["event.name"] == "gen_ai.evaluation.result" and attributes["nagent.evaluation.target_completed_at"] != nil'
          - 'set(cache["evaluation"]["nagent.evaluation.target_link"], attributes["nagent.evaluation.target_link"]) where attributes["event.name"] == "gen_ai.evaluation.result" and attributes["nagent.evaluation.target_link"] != nil'
          # Read the fixed event code from attributes (never from the body);
          # unknown/missing events are the fixed diagnostic code.
          - 'set(cache["event"], attributes["event"]) where attributes["event"] != nil'
          - 'set(cache["event"], "log_event_unknown") where attributes["event"] == nil'
          - 'set(cache["message"], cache["orig_body"])'
          # Sanitized exception/stack already flat-dotted by the app projection.
          - 'set(cache["exception"], {"type": attributes["exception.type"], "message": attributes["exception.message"], "stacktrace": attributes["exception.stacktrace"]}) where attributes["exception.type"] != nil'
          - 'set(cache["stack"], attributes["stack"]) where attributes["stack"] != nil'
          # 无活跃 span 时 OTTL 的 trace_id.string 为全零；带全零字段会生成
          # 指向空 trace 的伪 Tempo 链接，故无关联日志不含 trace 字段。
          - 'set(body, {"severity": severity_text, "logger": instrumentation_scope.name, "event": cache["event"], "message": cache["message"], "context": {"execution": cache["execution"]}, "details": cache["details"], "exception": cache["exception"], "stack": cache["stack"], "trace_id": trace_id.string, "span_id": span_id.string}) where trace_id.string != "00000000000000000000000000000000"'
          - 'set(body, {"severity": severity_text, "logger": instrumentation_scope.name, "event": cache["event"], "message": cache["message"], "context": {"execution": cache["execution"]}, "details": cache["details"], "exception": cache["exception"], "stack": cache["stack"]}) where trace_id.string == "00000000000000000000000000000000"'
          # 评估事件行体独立交付（T11）：封闭 evaluation 信封覆盖业务行体形状，
          # linked 携带 trace 关联、unlinked 不携带伪 Tempo 链接字段。这两条
          # 必须保持在业务行体装配语句之后（last-writer-wins：前移会被业务
          # 行体覆盖评估信封）。
          - 'set(body, {"severity": severity_text, "logger": instrumentation_scope.name, "event": cache["event"], "evaluation": cache["evaluation"], "trace_id": trace_id.string, "span_id": span_id.string}) where attributes["event.name"] == "gen_ai.evaluation.result" and trace_id.string != "00000000000000000000000000000000"'
          - 'set(body, {"severity": severity_text, "logger": instrumentation_scope.name, "event": cache["event"], "evaluation": cache["evaluation"]}) where attributes["event.name"] == "gen_ai.evaluation.result" and trace_id.string == "00000000000000000000000000000000"'
          # 评估记录属性显式清空：白名单之外的任何属性（含外来 langfuse.*）
          # 不进入 Loki structured metadata/索引标签。该语句必须存在——服务级
          # 清空语句只覆盖 n-agent/n-kb，无法覆盖非 n-agent 服务伪造的评估
          # 记录（与另两条清空语句的先后顺序无语义依赖）。
          - 'set(attributes, {}) where attributes["event.name"] == "gen_ai.evaluation.result"'
          # N-Agent attributes are explicitly projected above, never arbitrary Loki metadata.
          - 'set(attributes, {}) where resource.attributes["service.name"] == "n-agent"'
          # N-KB attributes are already explicitly represented in the JSON body.
          # Do not let unknown attributes bypass projection as Loki metadata.
          - 'set(attributes, {}) where resource.attributes["service.name"] == "n-kb"'
  # Drop low-severity placeholders even when they inherited an execution scene.
  # Preserve details, readable messages, exceptions/stacks and warnings/errors.
  filter/empty_unknown_logs:
    error_mode: ignore
    logs:
      log_record:
        - 'body["event"] == "log_event_unknown" and severity_number < SEVERITY_NUMBER_WARN and Len(body["details"]) == 0 and (body["message"] == nil or body["message"] == "" or body["message"] == "log_event_unknown") and body["exception"] == nil and (body["stack"] == nil or body["stack"] == "")'
  batch:
    timeout: 5s
    send_batch_size: 64
    send_batch_max_size: 64

exporters:
  # Trace -> Tempo OTLP receiver（内网服务名）
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 33554432
      num_consumers: 1
      block_on_overflow: false
      wait_for_result: false
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 60s
  # Metric -> Prometheus remote write receiver
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
    remote_write_queue:
      enabled: true
      queue_size: 32
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 60s
  # Log -> Loki 原生 OTLP HTTP 接收（/otlp/v1/logs）
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 33554432
      num_consumers: 1
      block_on_overflow: false
      wait_for_result: false
    retry_on_failure:
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 60s
  # Log -> Collector stdout（详细度必须能输出安全 body/关联字段，normal 仅计数不达标）
  debug:
    verbosity: detailed

service:
  extensions: [health_check]
  # 自身 telemetry 暴露给 Prometheus 抓取（新版默认不绑外部地址；用 readers
  # 显式声明 pull exporter，prometheus-self 监控才能从容器网络抓到）。
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  # 注意：logs level 保持默认 info —— debug exporter 的输出以 info 级别写入，
  # 设为 warn 会把 logs 管线的交付证据一并吞掉。
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/loki_json, filter/empty_unknown_logs, batch]
      # Loki 为主交付后端；debug exporter 保留交付证据（stdout 输出）
      exporters: [otlphttp/loki, debug]
